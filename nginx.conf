# Nginx DU CONTENEUR : sert les fichiers statiques produits par "nuxi generate".
# A ne pas confondre avec le nginx de l'hote EC2 (instad-infra/nginx/
# rgph.instad.dj.conf), qui termine le TLS et route /api/ vers le backend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|geojson)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : indispensable pour les routes dynamiques
    # (/regions/:code, /themes/:slug). Sans lui, un rechargement direct ou un
    # lien partage renverrait 404, le routage se faisant cote navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
